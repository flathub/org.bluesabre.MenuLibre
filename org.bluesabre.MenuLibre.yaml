app-id: org.bluesabre.MenuLibre
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: menulibre-wrapper
rename-icon: menulibre
rename-desktop-file: menulibre.desktop
rename-appdata-file: menulibre.appdata.xml
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --filesystem=xdg-data/flatpak:ro
  - --filesystem=xdg-data/applications:create
  - --filesystem=xdg-data/desktop-directories:create
  - --filesystem=xdg-config/menus:create
  - --filesystem=host-os:ro # /usr/share/[applications,desktop-directories,icons]
  - --filesystem=host-etc:ro # /etc/xdg/menus
  - --filesystem=/tmp # https://discourse.flathub.org/t/xdg-open-cannot-open-a-file-in-the-runtime-tmp-directory/11118

cleanup:
  - '/include'
  - '/lib/peas-demo'
  - '/lib/pkgconfig'
  - '/man'
  - '/share/aclocal'
  - '/share/gtk-doc'
  - '/share/man'
  - '/share/bash-completion'
  - '/share/pkgconfig'
  - '/share/vala'
  - '/share/doc'
  - '/share/locale'
  - '/share/desktop-directories'
  - '/etc'
  - '/libexec'
  - '/lib/python3.13/site-packages/psutil/tests'
  - '*.a'
  - '*.la'
  - '*.pyc'
  - '__pycache__'

modules:

  - name: glib
    buildsystem: meson
    config-opts:
      - '-Dtests=false'
      - '-Dselinux=disabled'
    sources:
      - type: archive
        url: 'https://download.gnome.org/sources/glib/2.86/glib-2.86.2.tar.xz'
        sha256: 8a724e970855357ea8101e27727202392a0ffd5410a98336aed54ec59113e611
      - type: shell # patch: do-not-test-exec
        commands:
          - sed -i '1942,1973d' gio/gdesktopappinfo.c
          - sed -i '1924,1936d' gio/gdesktopappinfo.c
    cleanup:
      - /share
      - /lib/girepository-1.0
      - /lib/glib-2.0
      - /bin

  - name: python-distutils-extra
    buildsystem: simple
    build-commands:
      - 'pip3 install --exists-action=i --no-index --find-links="file://${PWD}" --no-build-isolation --prefix=/app "python-distutils-extra"'
    sources:
      - type: file
        url: https://launchpad.net/python-distutils-extra/trunk/2.39/+download/python-distutils-extra-2.39.tar.gz
        sha256: 723f24f4d65fc8d99b33a002fbbb3771d4cc9d664c97085bf37f3997ae8063af

  - name: intltools
    buildsystem: autotools
    sources:
      - type: archive
        url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
        sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd
    cleanup:
      - '*'

  - name: gnome-menu
    buildsystem: autotools
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/gnome-menus.git
        tag: 3.38.1

  - name: python-psutil
    buildsystem: simple
    build-commands:
      - 'pip3 install --exists-action=i --no-index --find-links="file://${PWD}" --no-build-isolation --prefix=/app "psutil"'
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/e1/88/bdd0a41e5857d5d703287598cbf08dad90aed56774ea52ae071bae9071b6/psutil-7.1.3.tar.gz
        sha256: 6c86281738d77335af7aec228328e944b30930899ea760ecf33a4dba66be5e74


  - name: links
    buildsystem: autotools
    post-install:
      - ln -s links "${FLATPAK_DEST}/bin/elinks"
    cleanup: ['*']
    sources:
      - type: archive
        url: http://links.twibright.com/download/links-2.30.tar.gz
        sha256: 7f0d54f4f7d1f094c25c9cbd657f98bc998311122563b1d757c9aeb1d3423b9e

  - name: xmlto
    buildsystem: simple
    build-commands:
      - libtoolize --force
      - aclocal
      - autoheader
      - automake --force-missing --add-missing
      - autoconf
      - ./configure --prefix=/app
      - make
      - make install
    cleanup: ['*']
    sources:
      - type: archive
        url: https://releases.pagure.org/xmlto/xmlto-0.0.29.tar.bz2
        sha256: 6000d8e8f0f9040426c4f85d7ad86789bc88d4aeaef585c4d4110adb0b214f21

  - name: xdg-utils
    buildsystem: autotools
    cleanup:
      - /bin/xdg-email
      - /bin/xdg-open
    sources:
      - type: archive
        url: https://portland.freedesktop.org/download/xdg-utils-1.1.3.tar.gz
        sha256: d798b08af8a8e2063ddde6c9fa3398ca81484f27dec642c5627ffcaa0d4051d9

  - name: menulibre
    buildsystem: simple
    build-commands:
      - 'python3 setup.py install --prefix=/app'
    post-install:
      - 'install -D menulibre-wrapper /app/bin/menulibre-wrapper'
      - "desktop-file-edit --set-key=Exec --set-value='/app/bin/menulibre-wrapper' /app/share/applications/menulibre.desktop"
    sources:
      - type: script
        dest-filename: menulibre-wrapper
        commands:
          - FLATPAK_RUNTIME_DATA_DIRS=/usr/share:/usr/share/runtime/share:/run/host/user-share:/run/host/share
          - FLATPAK_APP_DATA_HOME=$XDG_DATA_HOME/flatpak/exports/share
          - HOST_DATA_DIRS=/run/host/usr/share:/run/host/usr/local/share
          - HOST_CONFIG_DIRS=/run/host/usr/share:/run/host/usr/local/share:/run/host/etc/xdg
          - export XDG_DATA_DIRS=$HOST_DATA_DIRS:$FLATPAK_APP_DATA_HOME:$OTHER_XDG_DATA_DIRS:$FLATPAK_RUNTIME_DATA_DIRS
          - export XDG_CONFIG_DIRS=$HOST_CONFIG_DIRS:$OTHER_XDG_CONFIG_DIRS
          - export GI_TYPELIB_PATH=$GI_TYPELIB_PATH:/lib/x86_64-linux-gnu/girepository-1.0
          - menulibre "$@"
      - type: git
        url: https://github.com/bluesabre/menulibre.git
        tag: menulibre-2.4.0
        commit: ad8f3f68d243088a3dc48514269b6a35dae19022
      - type: shell
        commands:

            # Fix start execute
            - sed -i '1521,1531d' menulibre/MenulibreApplication.py
            - sed -i '1520i\        subprocess.Popen(["xdg-open", filename])' menulibre/MenulibreApplication.py
            - sed -i '1521i\        GObject.timeout_add(8000, self.on_execute_timeout, filename)' menulibre/MenulibreApplication.py

            # Fix icon name
            - sed -i '317c\        return model[treeiter][1]' menulibre/IconEntry.py

            # Fix absolute icon paths
            - |
              cat <<EOF> patch-1
                          elif os.path.isfile('/run/host'+icon_name):
                              try:
                                  pixbuf = GdkPixbuf.Pixbuf.new_from_file('/run/host'+icon_name)
                                  if pixbuf is not None:
                                      scaled = pixbuf.scale_simple(48, 48,
                                                                  GdkPixbuf.InterpType.HYPER)
                                      self._image.set_from_pixbuf(scaled)
                                      self._on_successful_image(icon_name, icon_name)
                                      return
                              except:
                                  pass
              EOF
              sed -i '116rpatch-1' menulibre/IconEntry.py
            - |
              cat <<EOF> patch-2
                          if isinstance(icon, Gio.FileIcon):
                              icon_path = icon.get_file().get_path()
                              if not os.path.isfile(icon_path):
                                  icon = Gio.FileIcon.new(Gio.File.new_for_path("/run/host/"+icon_path))

              EOF
              sed -i '271rpatch-2' menulibre/MenuEditor.py

            # Fix uncaught exception
            - |
              cat <<EOF> patch-3
                              try:
                                  pixbuf = GdkPixbuf.Pixbuf.new_from_file(icon_name)
                                  if pixbuf is not None:
                                      scaled = pixbuf.scale_simple(48, 48,
                                                                  GdkPixbuf.InterpType.HYPER)
                                      self._image.set_from_pixbuf(scaled)
                                      self._on_successful_image(icon_name, icon_name)
                                      return
                              except:
                                  pass
              EOF
              sed -i -e '110rpatch-3' -e '110,116d' menulibre/IconEntry.py

            # Fixed the issue that theme.has_icon does not search for non-theme icons in gtk3 version
            - sed -i '95s/:/ or icon_theme.lookup_icon(icon_name, 48, Gtk.IconLookupFlags.FORCE_SVG):/' menulibre/IconEntry.py

            # Fix update-desktop-database
            # Manually execute 'update-desktop-database' to update the mimeinfo.cache in the user directory
            - |
              sed -i '190c\    subprocess.call(["update-desktop-database", GLib.get_user_data_dir()+"/applications"])' menulibre/MenulibreXdg.py
              sed -i '231i\    desktop_menu_update()' menulibre/MenulibreXdg.py

            # Fix GLib.get_system_config_dirs() return empty paths
            - sed -i -e '204a\        if len(path) == 0:\n            continue' menulibre/MenulibreXdg.py

            # Fix desktop_menu_install filter
            # https://github.com/bluesabre/menulibre/issues/212
            - sed -i -e '204s/config/data/' -e '207s/directory/desktop/' menulibre/MenulibreXdg.py
